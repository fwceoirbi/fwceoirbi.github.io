</script>
<style>
:root {
  --bg:#0d0f1a; --surface:#151828; --surface2:#1c2035; --surface3:#232840;
  --border:#272d45; --border2:#323a5a;
  --accent:#7c6fff; --accent2:#00e5b0; --accent3:#ff6b8a;
  --text:#eceef8; --dim:#8b90ac; --muted:#454d6a;
  --r:14px; --r2:10px; --r3:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;}

/* ── TOPBAR ── */
.topbar{background:rgba(13,15,26,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:200;padding:0 32px;}
.topbar-inner{display:flex;align-items:center;height:56px;gap:0;}
.brand{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#7c6fff,#00e5b0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:32px;white-space:nowrap;}
.nav-tabs{display:flex;height:100%;}
.nav-tab{padding:0 22px;height:100%;display:flex;align-items:center;gap:8px;
  font-size:.88rem;font-weight:600;color:var(--dim);cursor:pointer;
  border-bottom:3px solid transparent;transition:all .18s;white-space:nowrap;user-select:none;}
.nav-tab .ti{font-size:1.3rem;line-height:1;display:inline-flex;align-items:center;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{color:var(--text);border-bottom-color:var(--accent);}
.nav-tab .badge{background:var(--surface3);color:var(--dim);border-radius:12px;
  padding:1px 8px;font-size:.72rem;font-weight:700;transition:.18s;}
.nav-tab.active .badge{background:var(--accent);color:#fff;}

/* ── LEVEL 1 PANEL (settori / nazioni / aziende flat) ── */
.panel-l1{overflow:hidden;max-height:0;transition:max-height .32s cubic-bezier(.4,0,.2,1);
  background:var(--surface);border-bottom:1px solid var(--border);}
.panel-l1.open{max-height:320px;}
.panel-l1-inner{padding:18px 32px;overflow-y:auto;max-height:320px;}
.panel-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;
  color:var(--dim);margin-bottom:12px;font-weight:600;}
.card-row{display:flex;flex-wrap:wrap;gap:10px;}

/* L1 cards */
.l1-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);
  padding:11px 15px;cursor:pointer;transition:all .16s;min-width:130px;position:relative;}
.l1-card:hover{border-color:var(--accent);background:rgba(124,111,255,.07);}
.l1-card.selected{border-color:var(--accent);background:rgba(124,111,255,.13);
  box-shadow:0 0 0 1px var(--accent);}
.l1-card.ind.selected{border-color:var(--accent3);box-shadow:0 0 0 1px var(--accent3);}
.l1-card.naz.selected{border-color:var(--accent2);box-shadow:0 0 0 1px var(--accent2);}
.l1-card .lc-name{font-weight:700;font-size:.87rem;margin-bottom:2px;display:flex;align-items:center;gap:4px;}
.l1-card .lc-sub{font-size:.7rem;color:var(--dim);}
.l1-card .lc-badge{display:inline-block;margin-top:6px;border-radius:12px;
  padding:1px 8px;font-size:.7rem;font-weight:700;color:#fff;background:var(--accent);}
.l1-card.ind .lc-badge{background:var(--accent3);}
.l1-card.naz .lc-badge{background:var(--accent2);color:#000;}

/* ── LEVEL 2 PANEL (aziende di un settore/nazione) ── */
.panel-l2{overflow:hidden;max-height:0;transition:max-height .32s cubic-bezier(.4,0,.2,1);
  background:var(--surface);border-bottom:1px solid var(--border);}
.panel-l2.open{max-height:260px;}
.panel-l2-inner{padding:16px 32px;overflow-y:auto;max-height:260px;}
.l2-header{display:flex;align-items:center;gap:16px;margin-bottom:12px;}
.l2-title{font-weight:700;font-size:.95rem;}
.btn-all{background:var(--accent);color:#fff;border:none;border-radius:var(--r3);
  padding:6px 16px;font-size:.78rem;font-weight:700;cursor:pointer;transition:.15s;}
.btn-all:hover{background:#6a5fe0;}
.btn-all.ind{background:var(--accent3);}
.btn-all.ind:hover{background:#e05070;}
.btn-all.naz{background:var(--accent2);color:#000;}
.btn-all.naz:hover{background:#00c49a;}
#l2-cat-filter{background:var(--surface2);color:var(--text1);border:1px solid var(--border);border-radius:var(--r3);padding:5px 10px;font-size:.78rem;cursor:pointer;margin-left:8px;}
#l2-cat-filter:focus{outline:none;border-color:var(--accent);}

/* L2 azienda cards */
.l2-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);
  padding:10px 14px;cursor:pointer;transition:all .16s;min-width:120px;}
.l2-card:hover{border-color:var(--accent2);background:rgba(0,229,176,.07);}
.l2-card.selected{border-color:var(--accent2);background:rgba(0,229,176,.12);}
.l2-card .lc-name{font-weight:700;font-size:.85rem;margin-bottom:2px;}
.l2-card .lc-sub{font-size:.7rem;color:var(--dim);}
.l2-card .lc-badge{display:inline-block;margin-top:5px;border-radius:12px;
  padding:1px 7px;font-size:.68rem;font-weight:700;background:var(--accent2);color:#000;}

/* ── CONTENT ── */
.content{padding:28px 32px;max-width:1400px;margin:0 auto;}

/* Welcome */
.welcome{text-align:center;padding:80px 20px;}
.welcome h2{font-size:2rem;font-weight:800;
  background:linear-gradient(135deg,#7c6fff,#00e5b0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.welcome p{color:var(--dim);font-size:.95rem;margin:12px auto 32px;max-width:480px;line-height:1.7;}
.welcome-stats{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;}
.ws-kpi-main{text-align:center;margin-bottom:8px;}
.ws-kpi-main.ws .ws-num{font-size:3.6rem;font-weight:900;
  background:linear-gradient(135deg,#7c6fff,#00e5b0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.ws-kpi-main .ws-label{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}
.welcome-stats-links{margin-top:4px;}
.ws-clickable{cursor:pointer;padding:8px 16px;border-radius:12px;transition:background .18s;}
.ws-clickable:hover{background:rgba(124,111,255,.13);}
.ws .ws-num{font-size:2.4rem;font-weight:800;
  background:linear-gradient(135deg,#7c6fff,#00e5b0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.ws .ws-label{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}

/* Detail */
.detail-view{display:none;}
.detail-view.visible{display:block;}
.detail-header{margin-bottom:24px;}
.detail-header h2{font-size:1.5rem;font-weight:800;margin-bottom:5px;}
.dh-meta{font-size:.83rem;color:var(--dim);display:flex;flex-wrap:wrap;gap:16px;}
.dh-meta strong{color:var(--text);}

/* Visual row */
.visual-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:20px;}
@media(max-width:900px){.visual-row{flex-wrap:wrap;}}
@media(max-width:580px){.visual-row{flex-direction:column;}}
.vis-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;}
.vis-card-chart{flex:0 0 340px;}
.vis-card-hl{flex:1 1 auto;min-width:0;overflow:hidden;display:flex;flex-direction:column;}
.chart-wrap{position:relative;height:240px;}
.hl-table-wrap{flex:1 1 0;min-height:200px;max-height:600px;overflow-y:auto;}
.hl-table{width:100%;border-collapse:collapse;font-size:.73rem;}
.hl-table thead th{position:sticky;top:0;background:var(--surface2);color:var(--dim);text-transform:uppercase;font-size:.63rem;letter-spacing:.5px;padding:6px 8px;text-align:left;border-bottom:1px solid var(--border2);}
.hl-table tbody tr{border-bottom:1px solid var(--border);}
.hl-table tbody tr:hover{background:var(--surface2);}
.hl-az{padding:5px 8px;font-weight:700;color:var(--accent);white-space:nowrap;font-size:.7rem;}
.hl-desc{padding:5px 8px;color:var(--dim);font-size:.72rem;line-height:1.4;}
.hl-delta-val{font-weight:700;color:#e0e3f0;}
.hl-cat{padding:5px 8px;white-space:nowrap;}
.naz-flag{height:14px;width:auto;border-radius:2px;vertical-align:middle;margin-right:5px;}

/* ── HAMBURGER BUTTON (mobile only) ── */
.menu-btn{display:none;background:none;border:none;color:var(--text);font-size:1.4rem;cursor:pointer;

@media (max-width:640px){

    'mastercard': 'Mastercard',
    'poste': 'Poste Italiane',
    'salesforce': 'Salesforce',
    'schneider': 'Schneider Electric',
    'walmart': 'Walmart',
  };
  for (const [alias, canonical] of Object.entries(aliases)) {

  }
  return null;
}

let _svPages = [];
let _svIdx = 0;

function openSlideViewer(pages, title) {
  _svPages = pages;
  _svIdx = 0;
  const overlay = document.getElementById('slide-viewer-overlay');
  document.getElementById('sv-title').textContent = '📄 ' + title + ' — Investor Relations';
  overlay.style.display = 'flex';
  renderSlide();
  document.body.style.overflow = 'hidden';
}

function closeSlideViewer() {
  document.getElementById('slide-viewer-overlay').style.display = 'none';
  document.body.style.overflow = '';
}

function renderSlide() {
  const page = _svPages[_svIdx];
  const img = document.getElementById('sv-img');
  const counter = document.getElementById('sv-counter');
  img.src = '';
  img.alt = 'Caricamento...';
  img.src = GITHUB_SLIDES_BASE + 'pag_' + page + '.jpg';
  counter.textContent = (_svIdx + 1) + ' / ' + _svPages.length;
  document.getElementById('sv-prev').disabled = _svIdx === 0;
  document.getElementById('sv-next').disabled = _svIdx === _svPages.length - 1;
}

function svPrev() { if (_svIdx > 0) { _svIdx--; renderSlide(); } }
function svNext() { if (_svIdx < _svPages.length - 1) { _svIdx++; renderSlide(); } }

// Keyboard nav
document.addEventListener('keydown', (e) => {
  const ov = document.getElementById('slide-viewer-overlay');
  if (!ov || ov.style.display === 'none') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') svNext();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   svPrev();
  if (e.key === 'Escape') closeSlideViewer();
});

function openTab(tab, el) {
  document.querySelector('.nav-tabs').classList.remove('open');
  const p1 = document.getElementById('panel-l1');
  const p2 = document.getElementById('panel-l2');

  if (activeTab === tab && p1.classList.contains('open')) {
    // close everything
    p1.classList.remove('open');
    p2.classList.remove('open');
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    activeTab = selL1 = selL2 = null;
    return;
  }

  // switch tab → reset L2
  activeTab = tab;
  selL1 = null; selL2 = null;
  p2.classList.remove('open');
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');

  const labels = {
    aziende:    '🏢 Seleziona un\'azienda',
    industries: '🏭 Seleziona un settore industriale',
    nazioni:    '🌍 Seleziona una nazione',
    categorie:  '🏷️ Seleziona una categoria'
  };
  document.getElementById('l1-label').textContent = labels[tab];
  buildL1(tab);
  p1.classList.add('open');
}

// ── L1 grid ────────────────────────────────────────────────
function buildL1(tab) {
  const grid = document.getElementById('l1-grid');
  let entries;

  if (tab === 'aziende') {
    const map = {};
    KPI_DATA.forEach(r => {
      if (!r.azienda) return;
      if (!map[r.azienda]) map[r.azienda] = {sub: r.nazione+' · '+r.industria, count:0};
      map[r.azienda].count++;
    });
    entries = Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0]))
      .map(([k,v])=>({key:k, name:k, sub:v.sub, count:v.count, cls:''}));

  } else if (tab === 'industries') {
    const map = {};
    KPI_DATA.forEach(r => {
      if (!r.industria) return;
      if (!map[r.industria]) map[r.industria] = {azs:new Set(), count:0};
      map[r.industria].azs.add(r.azienda);
      map[r.industria].count++;
    });
    const indEmoji = {
      'Financial Services': '💰',
      'Automotive': '🚘',
      'Industrial & Manufacturing': '⚙️',
      'Technology': '🤖',
      'Telecom & Media': '📶',
      'Retail': '🛒',
      'Healthcare & Pharma': '🧬',
      'Food & Beverage': '🌾',
      'Assicurazioni': '🛡️',
      'Energy & Utilities': '🔋',
      'Entertainment & Media': '🎭'
    };
    entries = Object.entries(map).sort((a,b)=>b[1].count-a[1].count)
      .map(([k,v])=>({key:k, name:(indEmoji[k]?indEmoji[k]+' ':'')+k, sub:v.azs.size+' aziende', count:v.count, cls:'ind'}));

  } else if (tab === 'nazioni') {
    const map = {};
    const NAZ_LABEL = {
      'US':'USA','DE':'Germania','IT':'Italia','CH':'Svizzera',
      'JP':'Giappone','CN':'Cina','FR':'Francia','SE':'Svezia',
      'GB':'UK','DK':'Danimarca','NL':'Olanda','ES':'Spagna',
      'BE':'Belgio','AT':'Austria','PT':'Portogallo','IN':'India',
      'AU':'Australia','CA':'Canada','KR':'Corea del Sud','BR':'Brasile',
      'SG':'Singapore','NO':'Norvegia','FI':'Finlandia','PL':'Polonia',
    };
    KPI_DATA.forEach(r => {
      if (!r.nazione) return;
      if (!map[r.nazione]) map[r.nazione] = {azs:new Set(), count:0};
      map[r.nazione].azs.add(r.azienda);
      map[r.nazione].count++;
    });
    entries = Object.entries(map).sort((a,b)=>b[1].count-a[1].count)
      .map(([k,v])=>({key:k, name:NAZ_LABEL[k]||k, sub:v.azs.size+' aziende', count:v.count, cls:'naz'}));
  } else {
    // categorie
    const map = {};
    KPI_DATA.forEach(r => {
      const cat = r.categoria || '–';
      if (!map[cat]) map[cat] = {azs:new Set(), count:0};
      map[cat].azs.add(r.azienda);
      map[cat].count++;
    });
    entries = Object.entries(map).sort((a,b)=>b[1].count-a[1].count)
      .map(([k,v])=>({key:k, name:(CAT_EMOJI[k]?CAT_EMOJI[k]+' ':'')+k, sub:v.azs.size+' aziende', count:v.count, cls:'cat'}));
  }

  const FLAGS = {
    'US':'🇺🇸','DE':'🇩🇪','IT':'🇮🇹','CH':'🇨🇭',
    'JP':'🇯🇵','CN':'🇨🇳','FR':'🇫🇷','SE':'🇸🇪',
    'GB':'🇬🇧','DK':'🇩🇰','NL':'🇳🇱','ES':'🇪🇸',
    'BE':'🇧🇪','AT':'🇦🇹','PT':'🇵🇹','IN':'🇮🇳',
    'AU':'🇦🇺','CA':'🇨🇦','KR':'🇰🇷','BR':'🇧🇷',
    'SG':'🇸🇬','NO':'🇳🇴','FI':'🇫🇮','PL':'🇵🇱',
  };
  grid.innerHTML = entries.map(e => {
    const sel = selL1 === e.key ? ' selected' : '';
    // Bandiera: su nazioni sempre; su aziende se il record ha nazione; su industries nessuna
    let flag = '';
    if (e.cls === 'naz') {
      flag = FLAGS[e.key] ? `<img class="naz-flag" referrerpolicy="no-referrer" loading="lazy" src="https://flagcdn.com/24x18/${NAZ_ISO[e.key]||''}.png" alt="">` : '';
    } else if (e.cls === 'cat') {
      flag = '';
    } else if (e.cls === '') {
      // aziende: cerca la nazione nei dati
      const naz = KPI_DATA.find(r=>r.azienda===e.key)?.nazione||'';
      const iso = NAZ_ISO[naz];
      flag = iso ? `<img class="naz-flag" referrerpolicy="no-referrer" loading="lazy" src="https://flagcdn.com/24x18/${iso}.png" alt="${naz}">` : '';
    }
    return `<div class="l1-card ${e.cls}${sel}" onclick="selectL1('${esc(e.key)}')">
      <div class="lc-name">${flag}${e.name}</div>
      <div class="lc-sub">${e.sub}</div>
      <span class="lc-badge">${e.count} Use Cases</span>
    </div>`;
  }).join('');
}

// ── L1 selection ───────────────────────────────────────────
function selectL1(key) {
  selL1 = key;
  selL2 = null;
  buildL1(activeTab);   // refresh highlights

  if (activeTab === 'aziende') {
    // Direct: no L2, show detail immediately
    document.getElementById('panel-l2').classList.remove('open');
    loadDetail(KPI_DATA.filter(r=>r.azienda===key), key, false);
    return;
  }

  // Industries / Nazioni → show L2
  const rows = activeTab === 'industries'
    ? KPI_DATA.filter(r=>r.industria===key)
    : activeTab==='categorie'
    ? KPI_DATA.filter(r=>(r.categoria||'–')===key)
    : KPI_DATA.filter(r=>r.nazione===key);

  const azs = [...new Set(rows.map(r=>r.azienda))].sort();
  const azCount = {};
  rows.forEach(r=>{ if(r.azienda) azCount[r.azienda]=(azCount[r.azienda]||0)+1; });

  document.getElementById('l2-title').textContent = key;
  const btn = document.getElementById('l2-btn-all');
  btn.className = 'btn-all ' + (activeTab==='industries'?'ind': activeTab==='categorie'?'cat':'naz');

  const l2grid = document.getElementById('l2-grid');
  l2grid.innerHTML = azs.map(a => {
    const sel = selL2 === a ? ' selected' : '';
    const naz = rows.find(r=>r.azienda===a)?.nazione||'';
    const iso = NAZ_ISO[naz];
    const flag = iso ? `<img class="naz-flag" referrerpolicy="no-referrer" loading="lazy" src="https://flagcdn.com/24x18/${iso}.png" alt="${naz}">` : '';
    return `<div class="l2-card${sel}" onclick="selectL2('${esc(a)}')">
      <div class="lc-name">${flag}${a}</div>
      <div class="lc-sub">${naz}</div>
      <span class="lc-badge">${azCount[a]} Use Cases</span>
    </div>`;
  }).join('');

  document.getElementById('panel-l2').classList.add('open');
  // Auto-show all group KPI
  loadDetail(rows, key, true);
}

// ── L2 selection ───────────────────────────────────────────
function selectL2(az) {
  selL2 = az;
  // Refresh L2 grid highlight
  const l2grid = document.getElementById('l2-grid');
  l2grid.querySelectorAll('.l2-card').forEach(c=>{
    c.classList.toggle('selected', c.querySelector('.lc-name').textContent === az);
  });
  const rows = KPI_DATA.filter(r=>r.azienda===az);
  loadDetail(rows, az, false);
}

function showAllGroup() {
  selL2 = null;
  const l2grid = document.getElementById('l2-grid');
  l2grid.querySelectorAll('.l2-card').forEach(c=>c.classList.remove('selected'));
  const rows = activeTab==='industries'
    ? KPI_DATA.filter(r=>r.industria===selL1)
    : activeTab==='categorie'
    ? KPI_DATA.filter(r=>(r.categoria||'–')===selL1)
    : KPI_DATA.filter(r=>r.nazione===selL1);
  loadDetail(rows, selL1, true);
}

// ── Load detail view ───────────────────────────────────────
function loadDetail(rows, title, isGroup) {
  currentRows  = rows;
  filteredRows = [...rows].sort((a,b)=>(a.azienda||'').localeCompare(b.azienda||''));
  sortKey='azienda'; sortDir=1;

  document.getElementById('welcome').style.display='none';
  const dv = document.getElementById('detail-view');
  dv.style.display='block';

  const _titleEl = document.getElementById('dv-title');
  _titleEl.textContent = title;
  const _irD = getIRData(title);
  if (_irD && _irD.slidePages && _irD.slidePages.length > 0) {
    const _irLbl = document.createElement('span');
    _irLbl.className = 'ir-label';
    _irLbl.textContent = '🔗 Investor Relations';
    _irLbl.title = 'Visualizza slide IR per ' + title;
    _irLbl.onclick = (e) => { e.stopPropagation(); openSlideViewer(_irD.slidePages, title); };
    _titleEl.appendChild(_irLbl);
  } else if (_irD && _irD.irLink) {
    const _irLbl = document.createElement('span');
    _irLbl.className = 'ir-label';
    _irLbl.textContent = '🔗 Investor Relations';
    _irLbl.title = 'Apri IR per ' + title;
    _irLbl.onclick = (e) => { e.stopPropagation(); window.open(_irD.irLink, '_blank', 'noopener'); };
    _titleEl.appendChild(_irLbl);
  }
  buildMeta(rows, isGroup);

  // Populate cat filter (toolbar + l2 header)
  const cats=[...new Set(rows.map(r=>r.categoria).filter(Boolean))].sort();
  ['tbl-cat','l2-cat-filter'].forEach(id=>{
    const sel=document.getElementById(id);
    sel.innerHTML='<option value="">Tutte le categorie</option>';
    cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=(CAT_EMOJI[c]?CAT_EMOJI[c]+' ':'')+c;sel.appendChild(o);});
  });
  document.getElementById('tbl-search').value='';

  renderVisualsFrom(currentRows);
  renderTable();

  // Chiudi pannelli header solo per selezione singola (non per gruppo/industria)
  if (!isGroup) {
    document.querySelector('.nav-tabs').classList.remove('open');
    document.getElementById('panel-l1').classList.remove('open');
    document.getElementById('panel-l2').classList.remove('open');
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  }
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function buildMeta(rows, isGroup) {
  const parts=[];
  parts.push(`<span><strong>${rows.length}</strong> KPI</span>`);
  if(isGroup){
    const azs=[...new Set(rows.map(r=>r.azienda))];
    parts.push(`<span><strong>${azs.length}</strong> aziende</span>`);
  }
  const alta=rows.filter(r=>r.affidabilita==='Alta').length;
  parts.push(`<span><strong>${Math.round(alta/rows.length*100)}%</strong> fonti Alta affid.</span>`);
  if(!isGroup && rows[0]){
    const naz = rows[0].nazione;
    const iso = NAZ_ISO[naz];
    const flagImg = iso ? `<img class="naz-flag" referrerpolicy="no-referrer" loading="lazy" src="https://flagcdn.com/24x18/${iso}.png" alt="${naz}" style="vertical-align:middle;margin-right:4px;">` : '';
    if(naz) parts.push(`<span>${flagImg}${naz}</span>`);
    if(rows[0].industria) parts.push(`<span>🏭 ${rows[0].industria}</span>`);
  }
  document.getElementById('dv-meta').innerHTML=parts.join('');

  // ── Company profile pills ──
  const az = isGroup ? null : (rows[0] && rows[0].azienda);
  const co = az ? (CO_PROFILE[az] || null) : null;
  const pillsEl = document.getElementById('dv-co-pills');
  if(!pillsEl) return;
  if(!co){ pillsEl.innerHTML=''; return; }

  let html='';
  // Riga 1: dati finanziari
  if(co.revenue)   html+=`<span class="co-pill co-pill-fin">💰 Revenue · ${co.revenue}</span>`;
  else if(co.ebitda) html+=`<span class="co-pill co-pill-fin">💰 EBITDA · ${co.ebitda}</span>`;
  if(co.market_cap) html+=`<span class="co-pill co-pill-fin">📈 Market Cap · ${co.market_cap}</span>`;
  if(co.employees)  html+=`<span class="co-pill co-pill-emp">👥 Dipendenti · ${co.employees}</span>`;
  // Riga 2: AI
  if(co.ai_invest){
    const investLabel = co.ai_invest==='Included in tech spend'
      ? `<span class="co-pill co-pill-ai" title="${co.ai_note||''}">🤖 AI Invest · Incluso nel tech spend</span>`
      : `<span class="co-pill co-pill-ai" title="${co.ai_note||''}">🤖 AI Invest · ${co.ai_invest}</span>`;
    html+=investLabel;
  }
  if(co.ai_maturity) html+=`<span class="co-pill co-pill-mat">⚡ AI Maturity · ${co.ai_maturity}</span>`;
  if(co.ai_stack)    html+=`<span class="co-pill co-pill-stk" title="${co.ai_stack}">🔧 AI Stack · ${co.ai_stack.split(';')[0].trim()}</span>`;
  if(co.ir_url)      html+=`<a class="co-pill co-pill-ir" href="${co.ir_url}" target="_blank" rel="noopener">📎 IR</a>`;

  pillsEl.innerHTML=html;
}

// ── Visuals ────────────────────────────────────────────────
function renderVisualsFrom(rows) {
  const c=document.getElementById('dv-visuals');
  Object.values(charts).forEach(x=>x.destroy()); charts={};
  c.innerHTML=`
    <div class="vis-card vis-card-chart"><div class="vis-title">📊 Use Cases per Categoria</div><div class="chart-wrap"><canvas id="vc-donut"></canvas></div><div id="donut-hint" style="text-align:center;font-size:.72rem;color:#ffffff;margin-top:12px;letter-spacing:.3px;">👆 clicca una categoria per filtrare</div></div>
    <div class="vis-card vis-card-hl"><div class="vis-title">🎯 Highlights</div><div class="hl-table-wrap" id="vc-hl"></div></div>`;

  const cc={};
  rows.forEach(r=>{if(r.categoria)cc[r.categoria]=(cc[r.categoria]||0)+1;});
  const total=rows.length;
  const ce=CAT_ORDER.map(k=>[k,cc[k]||0]).filter(e=>e[1]>0)
    .concat(Object.entries(cc).filter(([k])=>!CAT_ORDER.includes(k)&&cc[k]>0));

  charts.d=new Chart(document.getElementById('vc-donut').getContext('2d'),{
    type:'doughnut',
    data:{labels:ce.map(e=>e[0]+(CAT_EMOJI[e[0]]?' '+CAT_EMOJI[e[0]]:'')),datasets:[{data:ce.map(e=>e[1]),
      backgroundColor:ce.map(e=>CAT_COLORS[e[0]]||'#454d6a'),
      borderColor:'rgba(0,0,0,.3)',borderWidth:2,hoverOffset:8}]},
    options:{
      responsive:true,maintainAspectRatio:false,cutout:'55%',
      plugins:{
        legend:{position:'right',labels:{color:'#ffffff',font:{size:16},boxWidth:14,padding:9}},
        tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.raw} (${Math.round(ctx.raw/total*100)}%)`}},
        datalabels:{display:false}
      }
    },
    plugins:[{
      id:'donutLabels',
      afterDatasetsDraw(chart){
        const {ctx,data,chartArea:{width,height}}=chart;
        const meta=chart.getDatasetMeta(0);
        const tot=rows.length||1;
        ctx.save();
        meta.data.forEach((arc,i)=>{
          const val=data.datasets[0].data[i];
          if(!val) return;
          const {x,y}=arc.tooltipPosition();
          const pct=Math.round(val/tot*100);
          ctx.font='bold italic 12px system-ui,sans-serif';
          ctx.fillStyle='#fff';
          ctx.textAlign='center';
          ctx.textBaseline='middle';
          if(arc.outerRadius - arc.innerRadius > 18){
            ctx.fillText(`${val}`, x, y-8);
            ctx.font='bold 16px system-ui,sans-serif';
            ctx.fillStyle='#ffffff';
            ctx.fillText(`${pct}%`, x, y+10);
          }
        });
        ctx.restore();
      }
    }]
  });

  /* ── Click su fetta donut → applica filtro categoria ── */
  (function(){
    const canvas = document.getElementById('vc-donut');
    if(!canvas) return;
    canvas.style.cursor = 'pointer';
    canvas.addEventListener('click', function(evt){
      const chart = charts.d;
      if(!chart) return;
      const pts = chart.getElementsAtEventForMode(evt,'nearest',{intersect:true},true);
      if(!pts.length) return;
      const cat = ce[pts[0].index][0];
      const sel = document.getElementById('tbl-cat');
      if(!sel) return;
      sel.value = (sel.value === cat) ? '' : cat;
      filterTable();
      // aggiorna hint
      const hint = document.getElementById('donut-hint');
      if(hint) hint.textContent = sel.value
        ? '👆 clicca sul grafico per tornare a tutte le categorie'
        : '👆 clicca una categoria per filtrare';
      // sincronizza eventuale secondo filtro categoria (layer 2)
      const sel2 = document.getElementById('l2-cat-filter');
      if(sel2) sel2.value = sel.value;
    });
  })();

  /* ── Tabella highlights ─────────────────────────────── */
  // Pre-calcola gli indici originali in KPI_DATA per ogni riga di hlData
  const hlData = rows
    .filter(r => (r.delta && r.delta !== '–' && r.delta !== '-' && r.delta !== 'N/A' && String(r.delta).trim() !== '')
              || r.use_case || r.kpi)
    .sort((a,b)=>(a.azienda||'').localeCompare(b.azienda||''));
  const hlOrigIdx = hlData.map(r => KPI_DATA.indexOf(r));

  const catBadge = cat => {
    const col = CAT_COLORS[cat]||'#454d6a';
    return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:.63rem;font-weight:700;background:${col};color:#fff;border:none">${cat||'–'}</span>`;
  };

  const hlRows = hlData.map(r => {
    const delta = String(r.delta||'').replace(/<[^>]+>/g,'').trim();
    const uc    = String(r.use_case||r.kpi||'').trim();

    const _hlIdx = hlData.indexOf(r);
    const _origIdx = hlOrigIdx[_hlIdx];
    const sentence = (KPI_HL[String(_origIdx)] || KPI_HL[String(_hlIdx)] || (delta || uc)).slice(0, 120);
    const desc = `<span class="hl-delta-val">${sentence}</span>`;
    const az = r.azienda || '';
    return `<tr>
      <td class="hl-az"><span onclick="selectL1('${az}')" style="cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;">${az}</span></td>
      <td class="hl-desc">${desc}</td>
      <td class="hl-cat">${catBadge(r.categoria)}</td>
    </tr>`;
  }).join('');

  document.getElementById('vc-hl').innerHTML = `
    <table class="hl-table">
      <thead><tr>
        <th style="width:90px">Azienda</th><th>Descrizione</th><th style="width:90px">Cat.</th>
      </tr></thead>
      <tbody>${hlRows||'<tr><td colspan="3" style="text-align:center;color:var(--dim);padding:20px">Nessun dato disponibile</td></tr>'}</tbody>
    </table>`;
}

// ── Table ──────────────────────────────────────────────────
function reloadL2Grid(rows) {
  const l2grid = document.getElementById('l2-grid');
  if (!l2grid || !document.getElementById('panel-l2').classList.contains('open')) return;
  const azCount = {};
  rows.forEach(r=>{ if(r.azienda) azCount[r.azienda]=(azCount[r.azienda]||0)+1; });
  const azs = [...new Set(rows.map(r=>r.azienda))].sort();
  if (azs.length === 0) {
    l2grid.innerHTML = '<div style="padding:12px;color:var(--dim);font-size:.8rem">Nessuna azienda per questa categoria</div>';
    return;
  }
  l2grid.innerHTML = azs.map(a => {
    const sel = selL2 === a ? ' selected' : '';
    const naz = rows.find(r=>r.azienda===a)?.nazione||'';
    const iso = NAZ_ISO[naz];
    const flag = iso ? `<img class="naz-flag" referrerpolicy="no-referrer" loading="lazy" src="https://flagcdn.com/24x18/${iso}.png" alt="${naz}">` : '';
    return `<div class="l2-card${sel}" onclick="selectL2('${esc(a)}')">
      <div class="lc-name">${flag}${a}</div>
      <div class="lc-sub">${naz}</div>
      <span class="lc-badge">${azCount[a]} Use Cases</span>
    </div>`;
  }).join('');
}
function applyL2CatFilter(){
  const cat=document.getElementById('l2-cat-filter').value;
  // sync il select nella toolbar
  document.getElementById('tbl-cat').value=cat;
  filterTable();
  // ricalcola anche l2-grid (elenco aziende), visuals (grafico + highlights)
  reloadL2Grid(filteredRows);
  renderVisualsFrom(filteredRows);
}

function filterTable(){
  const q=document.getElementById('tbl-search').value.toLowerCase().trim();
  const cat=document.getElementById('tbl-cat').value;
  filteredRows=currentRows.filter(r=>{
    if(cat&&r.categoria!==cat)return false;
    if(q){const h=[r.azienda,r.use_case,r.kpi,r.delta,r.funzione].join(' ').toLowerCase();if(!h.includes(q))return false;}
    return true;
  });
  if(sortKey)doSortRows();
  renderTable();
  // se il filtro è cambiato dal toolbar, aggiorna anche l2-grid e visuals
  const cat2=document.getElementById('l2-cat-filter').value;
  if(cat!==cat2){document.getElementById('l2-cat-filter').value=cat;}
  reloadL2Grid(filteredRows);
  renderVisualsFrom(filteredRows);
}

function doSortRows(){
  filteredRows.sort((a,b)=>{
    const av=(a[sortKey]||'').toLowerCase(),bv=(b[sortKey]||'').toLowerCase();
    return av<bv?-sortDir:av>bv?sortDir:0;
  });
}
function doSort(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}doSortRows();renderTable();}

function renderTable(){
  const q=document.getElementById('tbl-search').value.toLowerCase().trim();
  const showAz = !(activeTab==='aziende' || (activeTab!==null && selL2!==null));

  function hl(t){
    if(!q||!t)return t||'–';
    const s=String(t),i=s.toLowerCase().indexOf(q);
    if(i===-1)return s;
    return s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length);
  }
  function cb(c){return`<span class="cb cb-${c||''}">${c||'–'}</span>`;}
  function aff(a){return a==='Alta'?'<span class="aff-a">Alta</span>':a==='Media'?'<span class="aff-m">Media</span>':'–';}
  function lnk(u){if(!u||!u.startsWith('http'))return'–';return`<a href="${u}" target="_blank" rel="noopener">${u.replace(/https?:\/\//,'').substring(0,28)}…</a>`;}

  document.getElementById('tbl-head').innerHTML=
    (showAz?`<th onclick="doSort('azienda')">Azienda ↕</th>`:'')
    +`<th>Use Case AI</th><th>KPI / Beneficio</th>
    <th onclick="doSort('delta')">Delta ↕</th>
    <th onclick="doSort('categoria')">Cat. ↕</th>
    <th>Periodo</th><th>Fonte</th>`;

  const tbody=document.getElementById('tbl-body');
  if(!filteredRows.length){
    tbody.innerHTML='<tr><td colspan="8" class="no-data">Nessun risultato</td></tr>';
    document.getElementById('tbl-foot').textContent='Nessun risultato';
    return;
  }
  tbody.innerHTML=filteredRows.map(r=>`<tr>
    ${showAz?`<td class="td-az">${hl(r.azienda)}</td>`:''}
    <td class="td-uc">${hl(r.use_case)}</td>
    <td class="td-kpi">${hl(r.kpi)}</td>
    <td class="td-delta">${hl(r.delta)||'–'}</td>
    <td>${cb(r.categoria)}</td>
    <td style="font-size:.71rem;color:var(--dim);white-space:nowrap">${r.periodo||'–'}</td>
    <td class="td-link">${lnk(r.fonte)}</td>
  </tr>`).join('');
  document.getElementById('tbl-foot').textContent=
    `${filteredRows.length} Use Cases mostrati di ${currentRows.length} totali`;
}

// ── Export ─────────────────────────────────────────────────
function exportCSV(){
  const cols=['azienda','nazione','industria','funzione','use_case','kpi','categoria','delta','periodo','fonte','affidabilita'];
  const hdrs=['Azienda','Nazione','Industria','Funzione','Use Case AI','KPI Beneficio','Categoria','Delta','Periodo','Fonte'];
  const rows=[hdrs.join(';')];
  filteredRows.forEach(r=>{
    rows.push(cols.map(c=>{const v=String(r[c]||'').replace(/"/g,'""').replace(/;/g,',');return v.includes(',')?`"${v}"`:v;}).join(';'));
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'}));
  a.download=`KPI_${(document.getElementById('dv-title').textContent||'export').replace(/[^a-zA-Z0-9]/g,'_')}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

function esc(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\\'");}

// ── IR Popup functions ───────────────────────────────────
function irTextToHtml(rawText) {
  // Remove company/archetype header lines
  let txt = rawText
    .replace(/^[^\n]+ARCHETYPE[^\n]*\n?/, '')
    .replace(/^[A-Z]{2}\s·[^\n]+\n?/, '')
    .trim();

  // Sezioni riconosciute
  const SECTIONS = [
    'KPIs PRESS RELEASES TO THE MARKET',
    'WHAT THEY DO WITH AI',
    'THE MESSAGE FOR THE INVESTORS',
    'Projects (IR)',
    'Progetti (IR)',
    'STRATEGIC AI VISION',
    'Source IR',
    'Data from'
  ];

  // Helper: è una riga che inizia un "tipo" speciale?
  function lineType(line) {
    if (!line) return 'empty';
    if (SECTIONS.some(s => line.toUpperCase().startsWith(s.toUpperCase()))) return 'header';
    if (/^[\-+\d>~<][\d%$€.,MBTKkx+\-\/\s]+/.test(line) && line.length < 80) return 'kpi';
    if (line.startsWith('"') || line.startsWith('\u201c') || line.startsWith('\u2014') || line.startsWith('*"') || line.startsWith('\u201d')) return 'quote';
    return 'para';
  }

  let html = '';
  const lines = txt.split('\n');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i].trim();
    const lt = lineType(line);

    if (lt === 'empty') { i++; continue; }

    if (lt === 'header') {
      html += `<div class="ir-section-hdr">${escHtml(line)}</div>`;
      i++; continue;
    }

    if (lt === 'kpi') {
      html += `<div class="ir-kpi-line">${escHtml(line)}</div>`;
      i++; continue;
    }

    if (lt === 'quote') {
      // Accorpa righe quote consecutive
      let quoteLines = [line];
      i++;
      while (i < lines.length) {
        const next = lines[i].trim();
        if (!next) { i++; break; }
        if (lineType(next) !== 'quote' && lineType(next) !== 'para') break;
        // Se la riga precedente non finisce con . o : e la prossima non è un nuovo tipo, unisci
        if (lineType(next) === 'para' && quoteLines[quoteLines.length-1].match(/[.!?:;]$/)) break;
        quoteLines.push(next);
        i++;
      }
      html += `<blockquote class="ir-quote">${escHtml(quoteLines.join(' '))}</blockquote>`;
      continue;
    }

    // Para: accorpa righe consecutive fino a riga vuota, header, kpi o quote
    let paraLines = [line];
    i++;
    while (i < lines.length) {
      const next = lines[i].trim();
      const nt = lineType(next);
      if (nt === 'empty' || nt === 'header' || nt === 'kpi' || nt === 'quote') break;
      // Spezza solo se la riga precedente finisce con punto/due punti (fine frase chiara)
      // e la prossima inizia con maiuscola (inizio frase nuova), oppure se la riga precedente è lunga
      const prev = paraLines[paraLines.length - 1];
      const endsClean = /[.!?]$/.test(prev);
      const nextStartsCap = /^[A-Z\u00C0-\u00DC]/.test(next);
      if (endsClean && nextStartsCap && prev.length > 60) {
        break; // nuova frase abbastanza distinta → nuovo paragrafo
      }
      paraLines.push(next);
      i++;
    }
    html += `<p class="ir-para">${escHtml(paraLines.join(' '))}</p>`;
  }
  return html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openIRPopup(companyName) {
  const d = getIRData(companyName);
  if (!d) return;
  
  const rawText = d.text || '';
  
  // Parse archetype
  let archetype = '';
  const arcMatch = rawText.match(/ARCHETYPE\s+([^\n]+)/i);
  if (arcMatch) archetype = arcMatch[1].replace(/^[A-Z]{2,3}\s·[^·]+·\s*/, '').trim();
  
  document.getElementById('ir-popup-title').textContent = d.key || companyName;
  document.getElementById('ir-popup-archetype').textContent = archetype ? '⬡ ' + archetype : '';
  
  // Render text as formatted HTML
  document.getElementById('ir-popup-text').innerHTML = irTextToHtml(rawText);
  
  // Esempi: show IR slides from embedded base64 images
  const label = document.getElementById('ir-examples-label');
  const grid = document.getElementById('ir-slides-grid');
  grid.innerHTML = '';
  
  // Remove old esempi link if present
  const oldLink = document.getElementById('ir-esempi-link-el');
  if (oldLink) oldLink.remove();
  
  const slides = IR_SLIDES[companyName] || [];
  if (slides.length > 0) {
    label.style.display = 'inline-block';
    grid.style.display = 'grid';
    slides.forEach((src) => {
      const img = document.createElement('img');
      img.src = src;
      img.className = 'ir-slide-thumb';
      img.onclick = () => openIRLightbox(src);
      grid.appendChild(img);
    });
  } else if (d.examplesLink) {
    label.style.display = 'inline-block';
    grid.style.display = 'none';
    const link = document.createElement('a');
    link.id = 'ir-esempi-link-el';
    link.className = 'ir-esempi-link';
    link.href = d.examplesLink;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.innerHTML = `<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>Apri slide Esempi nel documento`;
    label.insertAdjacentElement('afterend', link);
  } else {
    label.style.display = 'none';
    grid.style.display = 'none';
  }
  
  document.getElementById('ir-popup-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeIRPopup() {
  document.getElementById('ir-popup-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function openIRLightbox(src) {
  const img = document.getElementById('ir-lightbox-img');
  const errDiv = document.getElementById('ir-lb-err');
  if(errDiv) errDiv.style.display = 'none';
  img.style.display = '';
  img.src = '';
  // Piccolo delay per forzare reload
  setTimeout(() => { img.src = src; }, 10);
  document.getElementById('ir-lightbox').classList.add('open');
}

function closeIRLightbox() {
  document.getElementById('ir-lightbox').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeIRPopup(); closeIRLightbox(); }
});
