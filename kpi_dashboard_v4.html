<!DOCTYPE html>
<!--
  The sign-in page.

  Deliberately dumb: it collects a password, posts it, and reloads. It performs no
  check of its own and holds no secret, because anything it decided could be
  decided differently by whoever is holding the browser. The real gate is the
  trusted key group on the CloudFront behavior serving the reports.

  Served under /_login*, the one static behavior without a key group -- an
  unauthenticated viewer has to be able to reach it, and CloudFront's 403 custom
  error response points here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Ross Reports</title>
<link rel="stylesheet" href="/_login/style.css">
</head>
<body class="login">
<main>
  <form id="form" autocomplete="off">
    <h1>Ross Reports</h1>
    <p class="muted">This site is password protected.</p>

    <label for="password">Password</label>
    <!-- No username field: there are no accounts, only one shared password. -->
    <input id="password" name="password" type="password" required autofocus
           autocomplete="current-password" spellcheck="false">

    <button id="submit" type="submit">Sign in</button>

    <p id="error" class="error" role="alert" aria-live="polite" hidden></p>
  </form>
</main>
<script src="/_login/login.js"></script>
</body>
</html>
